<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseClaw</title>
  <!-- Markdown & Code Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --sidebar-bg: #161b22;
      --card-bg: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #1f6feb;
      --warn-bg: rgba(210, 153, 34, 0.1);
      --warn-border: #d29922;
      --warn-text: #e3b341;
      --success: #3fb950;
      --code-bg: #161b22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }

    /* Left Sidebar */
    .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .brand-bar { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 14px; padding: 9px 12px; background: #21262d; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.15s; }
    .new-chat-btn:hover { background: #30363d; border-color: #8b949e; }

    .section-title { padding: 12px 18px 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Bot Roster */
    .roster-list { padding: 0 10px; margin-bottom: 12px; }
    .bot-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; transition: background 0.15s; }
    .bot-item:hover, .bot-item.active { background: #21262d; }
    .bot-icon { font-size: 16px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: #0d1117; border-radius: 6px; border: 1px solid var(--border); }
    .bot-name { font-size: 13px; font-weight: 500; }

    /* Session List */
    .session-list { flex: 1; overflow-y: auto; padding: 0 10px; }
    .session-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; font-size: 13px; color: var(--text); transition: 0.15s; }
    .session-item:hover, .session-item.active { background: #21262d; }
    .session-item.active { border-left: 2px solid var(--accent); }
    .session-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .session-time { font-size: 11px; color: var(--muted); }

    /* Main Workspace */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .header { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--sidebar-bg); }
    .header-left { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

    .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 20%; display: flex; flex-direction: column; gap: 20px; }
    @media (max-width: 1200px) { .chat-scroll { padding: 20px 8%; } }

    /* Message Bubbles */
    .msg-row { display: flex; gap: 12px; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: #21262d; border: 1px solid var(--border); }
    .msg-content { max-width: 85%; padding: 12px 16px; border-radius: 8px; line-height: 1.6; word-break: break-word; }
    .msg-row.user .msg-content { background: #1f6feb; color: white; border-bottom-right-radius: 2px; }
    .msg-row.assistant .msg-content { background: var(--card-bg); border: 1px solid var(--border); border-bottom-left-radius: 2px; flex: 1; }

    /* Markdown Styling */
    .markdown-body pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
    .markdown-body code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .markdown-body p { margin-bottom: 8px; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 8px; }

    /* Tool Call Collapsible Accordion */
    .tool-accordion { border: 1px solid var(--border); border-radius: 6px; background: #161b22; margin: 8px 0; overflow: hidden; font-size: 12px; }
    .tool-summary { padding: 8px 12px; background: #21262d; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-family: monospace; color: #79c0ff; user-select: none; }
    .tool-summary:hover { background: #30363d; }
    .tool-body { padding: 12px; border-top: 1px solid var(--border); font-family: monospace; font-size: 12px; background: #0d1117; max-height: 250px; overflow-y: auto; color: #c9d1d9; white-space: pre-wrap; }

    /* Action Confirmation Card (Native Approval Card) */
    .confirm-card { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 16px 18px; margin: 12px 0; }
    .confirm-header { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--warn-text); font-size: 14px; margin-bottom: 8px; }
    .confirm-text { color: #f0f6fc; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .confirm-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: 0.15s; }
    .btn-allow { background: #238636; color: white; }
    .btn-allow:hover { background: #2ea043; }
    .btn-deny { background: #21262d; color: var(--text); border-color: var(--border); }
    .btn-deny:hover { background: #30363d; }

    /* Footer & Input */
    .footer { padding: 16px 20% 20px; background: var(--bg); border-top: 1px solid var(--border); }
    @media (max-width: 1200px) { .footer { padding: 14px 8% 18px; } }
    .presets { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; }
    .preset-chip { font-size: 12px; background: #21262d; color: var(--muted); border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; cursor: pointer; white-space: nowrap; transition: 0.15s; }
    .preset-chip:hover { color: var(--text); border-color: #8b949e; }
    .input-wrapper { display: flex; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; align-items: flex-end; }
    .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .input-box { flex: 1; background: transparent; border: none; color: var(--text); font-size: 14px; resize: none; max-height: 160px; min-height: 38px; outline: none; padding: 8px; line-height: 1.5; }
    .send-btn { background: var(--accent); color: white; border: none; border-radius: 6px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-bottom: 2px; }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal Styles */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
    .modal { background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 10px; width: 850px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 32px rgba(0,0,0,0.5); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .routine-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .routine-header { display: flex; align-items: center; justify-content: space-between; }
    .routine-name { font-weight: 600; font-size: 14px; }
    .routine-meta { font-size: 12px; color: var(--muted); display: flex; gap: 16px; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-idle { background: #21262d; color: #8b949e; }
    .badge-running { background: rgba(47, 129, 247, 0.2); color: #58a6ff; }
    .badge-paused { background: rgba(210, 153, 34, 0.2); color: #d29922; }
    .code-block { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: monospace; font-size: 12px; color: #79c0ff; word-break: break-all; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="brand-bar">
      <div class="brand-title">🐾 MuseClaw</div>
    </div>

    <button class="new-chat-btn" onclick="startNewSession()">
      <span>+</span> 新建对话
    </button>
    <button class="new-chat-btn" style="margin-top: -4px;" onclick="openRoutinesModal()">
      <span>⏰</span> 主动巡检与 Webhook
    </button>

    <div class="section-title">数字员工</div>
    <div class="roster-list" id="rosterList">
      <!-- 动态加载 Bot 列表 -->
    </div>

    <div class="section-title">历史对话</div>
    <div class="session-list" id="sessionList">
      <!-- 动态加载历史会话 -->
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="header">
      <div class="header-left">
        <div class="status-dot"></div>
        <span id="currentBotTitle">💻 运维助手</span>
      </div>
      <div style="font-size: 12px; color: var(--muted);" id="sessionStatus">就绪</div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <!-- 初始欢迎语 -->
      <div class="msg-row assistant">
        <div class="avatar">🐾</div>
        <div class="msg-content markdown-body">
          你好！我是你的专属常驻数字员工，已挂载当前沙箱工作区与工具链。可以直接吩咐我执行日常自动化、文件处理或巡检任务。
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="presets">
        <div class="preset-chip" onclick="usePreset('请查看当前系统的基础运行状态（uptime 与系统信息）')">查看系统基础状态</div>
        <div class="preset-chip" onclick="usePreset('请在 /tmp/test_muse.txt 创建测试文件，确认内容后使用 rm -rf 清理')">测试高危敏感操作确认</div>
      </div>
      <div class="input-wrapper">
        <textarea id="promptInput" class="input-box" rows="1" placeholder="发送指令或提问... (Enter 发送，Shift+Enter 换行)" onkeydown="handleKeyDown(event)"></textarea>
        <button id="sendBtn" class="send-btn" onclick="sendTask()">↑</button>
      </div>
    </div>
  </div>

  <script>
    let currentBotId = 'ops_bot';
    let currentSessionId = '';

    // 初始化 marked 与代码高亮
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // 页面加载拉取 Bot 列表与会话历史
    window.addEventListener('DOMContentLoaded', async () => {
      await loadBots();
      await loadSessions();
    });

    async function loadBots() {
      try {
        const res = await fetch('/api/bots');
        const bots = await res.json();
        const container = document.getElementById('rosterList');
        if (!container) return;
        container.innerHTML = bots.map(b => `
          <div class="bot-item ${b.id === currentBotId ? 'active' : ''}" id="bot_item_${b.id}" onclick="switchBot('${b.id}', '${escapeHtml(b.name)}')">
            <div class="bot-icon">${b.is_coordinator ? '👑' : '🤖'}</div>
            <div class="bot-name">${escapeHtml(b.name)}</div>
          </div>
        `).join('');

        if (!currentBotId && bots.length > 0) {
          const defaultBot = bots.find(b => b.is_coordinator) || bots[0];
          currentBotId = defaultBot.id;
          document.getElementById('currentBotTitle').innerText = defaultBot.name;
          const el = document.getElementById(`bot_item_${defaultBot.id}`);
          if (el) el.classList.add('active');
        }
      } catch (err) {
        console.error('加载数字员工失败:', err);
      }
    }

    async function switchBot(id, title) {
      currentBotId = id;
      document.getElementById('currentBotTitle').innerText = title;
      document.querySelectorAll('.bot-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`bot_item_${id}`);
      if (activeEl) activeEl.classList.add('active');
      startNewSession();
      await loadSessions();
    }

    async function loadSessions() {
      try {
        const query = currentBotId ? `?bot_id=${encodeURIComponent(currentBotId)}` : '';
        const res = await fetch(`/api/sessions${query}`);
        const list = await res.json();
        const container = document.getElementById('sessionList');
        container.innerHTML = '';
        list.forEach(s => {
          const item = document.createElement('div');
          item.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
          item.id = `sess_item_${s.id}`;
          item.onclick = () => switchSession(s.id);
          item.innerHTML = `<span class="session-name">${escapeHtml(s.title || '会话')}</span><span class="session-time">${formatTime(s.createdAt || s.updatedAt || Date.now())}</span>`;
          container.appendChild(item);
        });
      } catch {}
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function startNewSession() {
      currentSessionId = `sess_${Date.now()}`;
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      const container = document.getElementById('chatScroll');
      container.innerHTML = `
        <div class="msg-row assistant">
          <div class="avatar">🐾</div>
          <div class="msg-content markdown-body">
            已开启新对话，请问有什么可以协助你的？
          </div>
        </div>
      `;
    }

    async function switchSession(id) {
      currentSessionId = id;
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`sess_item_${id}`);
      if (activeEl) activeEl.classList.add('active');

      const res = await fetch(`/api/sessions/${id}`);
      if (!res.ok) return;
      const data = await res.json();
      
      const container = document.getElementById('chatScroll');
      container.innerHTML = '';

      data.messages.forEach(m => {
        if (m.role === 'user') {
          appendUserMsg(m.content);
        } else if (m.role === 'assistant') {
          appendAssistantMsg(m.content);
        }
      });
      container.scrollTop = container.scrollHeight;
    }

    function usePreset(text) {
      const input = document.getElementById('promptInput');
      input.value = text;
      sendTask();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTask();
      }
    }

    function appendUserMsg(text) {
      const container = document.getElementById('chatScroll');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="msg-content">${escapeHtml(text)}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function appendAssistantMsg(text = '') {
      const container = document.getElementById('chatScroll');
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.innerHTML = `<div class="avatar">🐾</div><div class="msg-content markdown-body">${marked.parse(text)}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return row.querySelector('.msg-content');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function sendTask() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendUserMsg(text);
      const assistantBox = appendAssistantMsg('');
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      document.getElementById('sessionStatus').innerText = '正在执行...';

      let accumulatedText = '';

      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, botId: currentBotId, sessionId: currentSessionId })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const event = JSON.parse(line.slice(6));
              
              if (event.type === 'session:init') {
                currentSessionId = event.session_id || event.sessionId;
                if (event.bot_id || event.botId) {
                  currentBotId = event.bot_id || event.botId;
                  if (event.botName) {
                    document.getElementById('currentBotTitle').innerText = event.botName;
                  }
                  document.querySelectorAll('.bot-item').forEach(el => el.classList.remove('active'));
                  const activeEl = document.getElementById(`bot_item_${currentBotId}`);
                  if (activeEl) activeEl.classList.add('active');
                }
                loadSessions();
              }

              if (event.type === 'stream:text-delta') {
                accumulatedText += event.text;
                assistantBox.innerHTML = marked.parse(accumulatedText);
                document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
              }

              if (event.type === 'tool:call_start') {
                renderToolAccordion(event.toolName, event.input);
              }

              if (event.type === 'tool:call_end') {
                updateToolAccordion(event.toolName, event.output, event.durationMs);
              }

              if (event.type === 'sentinel:approval_needed') {
                renderActionConfirmation(event.request);
              }
            }
          }
        }
      } catch (err) {
        assistantBox.innerHTML += `<p style="color:#f85149;">[请求中断: ${err.message}]</p>`;
      } finally {
        sendBtn.disabled = false;
        document.getElementById('sessionStatus').innerText = '就绪';
        loadSessions();
      }
    }

    let activeToolEl = null;

    function renderToolAccordion(name, input) {
      const container = document.getElementById('chatScroll');
      const wrap = document.createElement('div');
      wrap.style.paddingLeft = '44px';
      wrap.innerHTML = `
        <details class="tool-accordion" open>
          <summary class="tool-summary">
            <span>⚙️ 正在执行操作: ${name}</span>
            <span style="font-size:11px; color:#8b949e;">运行中...</span>
          </summary>
          <div class="tool-body">输入参数:\n${escapeHtml(JSON.stringify(input, null, 2))}</div>
        </details>
      `;
      container.appendChild(wrap);
      activeToolEl = wrap;
      container.scrollTop = container.scrollHeight;
    }

    function updateToolAccordion(name, output, durationMs) {
      if (!activeToolEl) return;
      const details = activeToolEl.querySelector('details');
      const summary = activeToolEl.querySelector('.tool-summary');
      const body = activeToolEl.querySelector('.tool-body');
      
      summary.innerHTML = `
        <span>✓ 已完成: ${name}</span>
        <span style="font-size:11px; color:#3fb950;">${durationMs}ms</span>
      `;
      body.innerHTML += `\n\n执行输出:\n${escapeHtml(JSON.stringify(output, null, 2))}`;
      details.removeAttribute('open'); // 默认折叠以保持界面清爽
      activeToolEl = null;
    }

    // 操作权限确认卡片（去除底层 Sentinel 内部名词）
    function renderActionConfirmation(req) {
      const container = document.getElementById('chatScroll');
      const card = document.createElement('div');
      card.className = 'confirm-card';
      card.id = `confirm_${req.approvalId}`;
      card.style.marginLeft = '44px';
      card.innerHTML = `
        <div class="confirm-header">
          <span>⚠️ 敏感操作执行确认</span>
        </div>
        <div class="confirm-text">${escapeHtml(req.actionSummary)}</div>
        <div class="confirm-btns">
          <button class="btn btn-deny" onclick="resolveAction('${req.approvalId}', false)">拒绝</button>
          <button class="btn btn-allow" onclick="resolveAction('${req.approvalId}', true)">允许执行</button>
        </div>
      `;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    async function resolveAction(approvalId, approved) {
      const card = document.getElementById(`confirm_${approvalId}`);
      if (card) {
        card.innerHTML = `<div style="font-size:13px; color:${approved ? '#3fb950' : '#8b949e'};">` +
          `已${approved ? '允许操作，正在继续执行...' : '已拒绝该操作'}</div>`;
      }
      await fetch(`/api/approvals/${approvalId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ approved })
      });
    }

    // --- 主动任务与 Webhook 管理弹窗逻辑 ---
    async function openRoutinesModal() {
      document.getElementById('routinesModal').style.display = 'flex';
      await loadRoutinesData();
    }

    function closeRoutinesModal() {
      document.getElementById('routinesModal').style.display = 'none';
    }

    async function loadRoutinesData() {
      try {
        const [rRes, hRes, runsRes] = await Promise.all([
          fetch('/api/routines').then(r => r.json()),
          fetch('/api/hooks').then(r => r.json()),
          fetch('/api/routines/runs').then(r => r.json())
        ]);

        // 渲染例行任务
        const rListEl = document.getElementById('routinesListContainer');
        rListEl.innerHTML = rRes.map(r => `
          <div class="routine-card">
            <div class="routine-header">
              <div class="routine-name">⏰ ${escapeHtml(r.name)}</div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge badge-${r.status}">${r.status === 'running' ? '运行中' : (r.enabled ? '已启用' : '已暂停')}</span>
                <button class="btn btn-deny" style="padding:3px 8px; font-size:11px;" onclick="triggerRoutineNow('${r.id}')">立即执行</button>
                <button class="btn btn-deny" style="padding:3px 8px; font-size:11px;" onclick="toggleRoutineStatus('${r.id}')">${r.enabled ? '暂停' : '启用'}</button>
              </div>
            </div>
            <div class="routine-meta">
              <span>Cron: <code>${escapeHtml(r.cronExpr || '-')}</code></span>
              <span>执行角色: <code>${escapeHtml(r.agentId)}</code></span>
              <span>下次运行: ${r.nextRunAt ? new Date(r.nextRunAt).toLocaleString() : '未排期'}</span>
            </div>
            <div style="font-size:12px; color:var(--muted); line-height:1.4;">${escapeHtml(r.instructions)}</div>
          </div>
        `).join('');

        // 渲染 Webhook
        const hListEl = document.getElementById('hooksListContainer');
        hListEl.innerHTML = hRes.map(h => `
          <div class="routine-card">
            <div class="routine-header">
              <div class="routine-name">⚡ ${escapeHtml(h.name)}</div>
              <span class="badge badge-idle">并发上限: ${h.maxPending}</span>
            </div>
            <div class="code-block">
              curl -X POST http://${window.location.host}/api/hooks/${h.id} \\<br/>
              &nbsp;&nbsp;-H "Authorization: Bearer ${h.secret}" \\<br/>
              &nbsp;&nbsp;-H "Content-Type: application/json" \\<br/>
              &nbsp;&nbsp;-d '{"event":"alert","payload":{"metric":"cpu","value":"95%"}}'
            </div>
          </div>
        `).join('');

        // 渲染运行历史
        const runsListEl = document.getElementById('runsListContainer');
        if (runsRes.length === 0) {
          runsListEl.innerHTML = '<div style="font-size:12px; color:var(--muted);">暂无执行记录</div>';
        } else {
          runsListEl.innerHTML = runsRes.map(run => `
            <div style="padding:8px 12px; background:#161b22; border:1px solid var(--border); border-radius:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-weight:600;">${escapeHtml(run.routineName)}</span>
                <span style="color:var(--muted); margin-left:8px;">[${run.triggerSource}]</span>
                <span style="color:var(--muted); margin-left:8px;">${new Date(run.startedAt).toLocaleTimeString()}</span>
                ${run.approvalRequired ? '<span style="color:#d29922; margin-left:8px;">⚠️ 曾需审批</span>' : ''}
              </div>
              <div>
                <span class="badge" style="background:${run.status === 'success' ? '#238636' : (run.status === 'running' ? '#1f6feb' : '#da3633')}; color:white;">${run.status}</span>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function triggerRoutineNow(id) {
      await fetch(`/api/routines/${id}/run`, { method: 'POST' });
      alert('已触发立即执行，稍后可在会话或运行记录中查看结果。');
      loadRoutinesData();
    }

    async function toggleRoutineStatus(id) {
      await fetch(`/api/routines/${id}/toggle`, { method: 'POST' });
      loadRoutinesData();
    }
  </script>

  <!-- Routines & Hooks Modal -->
  <div class="modal-overlay" id="routinesModal" onclick="if(event.target===this) closeRoutinesModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⏰ 主动例行巡检与外部 Webhook 管理</div>
        <button class="modal-close" onclick="closeRoutinesModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <div style="font-size:13px; font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between;">
            <span>📅 周期例行任务 (Cron Schedules)</span>
          </div>
          <div id="routinesListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <div>
          <div style="font-size:13px; font-weight:600; margin-bottom:8px;">
            <span>⚡ 外部系统入站 Webhook (Events & Alerts)</span>
          </div>
          <div id="hooksListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <div>
          <div style="font-size:13px; font-weight:600; margin-bottom:8px;">
            <span>📋 最近自动化执行记录</span>
          </div>
          <div id="runsListContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
