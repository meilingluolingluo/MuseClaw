<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseClaw · 企业常驻数字员工工作台</title>
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #1e293b;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger-bg: #451a1a;
      --danger-border: #dc2626;
      --danger-text: #fca5a5;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Left Sidebar: Roster */
    .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .brand { padding: 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; background: #065f46; color: #6ee7b7; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
    .roster-title { padding: 16px 20px 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .roster-list { flex: 1; overflow-y: auto; padding: 0 10px; }
    .bot-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; transition: background 0.2s; }
    .bot-item:hover, .bot-item.active { background: #334155; }
    .bot-avatar { font-size: 24px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #0f172a; border-radius: 8px; }
    .bot-info { flex: 1; overflow: hidden; }
    .bot-name { font-size: 14px; font-weight: 600; }
    .bot-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Main Chat Panel */
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--sidebar); }
    .active-bot-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status-indicator { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
    .message.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 2px; white-space: pre-wrap; }

    /* Tool Call Badge */
    .tool-box { align-self: flex-start; background: #0b1329; border: 1px solid #1e3a8a; border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 12px; max-width: 85%; color: #93c5fd; }
    .tool-box pre { margin-top: 6px; color: #cbd5e1; overflow-x: auto; }

    /* Sentinel Approval Card */
    .sentinel-card { align-self: center; width: 90%; max-width: 600px; background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: 12px; padding: 18px 20px; box-shadow: 0 8px 24px rgba(220, 38, 38, 0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { border-color: #dc2626; } 50% { border-color: #f87171; } }
    .sentinel-header { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 15px; color: #fca5a5; margin-bottom: 8px; }
    .sentinel-desc { font-size: 13px; color: #fecaca; margin-bottom: 12px; line-height: 1.4; }
    .sentinel-actions { display: flex; gap: 12px; justify-content: flex-end; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-approve { background: #16a34a; color: white; }
    .btn-approve:hover { background: #15803d; }
    .btn-reject { background: #475569; color: white; }
    .btn-reject:hover { background: #334155; }

    /* Footer & Input */
    .footer { padding: 16px 24px 20px; background: var(--sidebar); border-top: 1px solid var(--border); }
    .presets { display: flex; gap: 8px; margin-bottom: 10px; }
    .preset-btn { font-size: 12px; background: #334155; color: #cbd5e1; border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; cursor: pointer; }
    .preset-btn:hover { background: #475569; color: white; }
    .input-bar { display: flex; gap: 10px; }
    .input-box { flex: 1; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
    .input-box:focus { border-color: var(--accent); }
    .send-btn { background: var(--accent); color: white; padding: 0 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Left: Roster Panel -->
  <div class="sidebar">
    <div class="brand">
      <span>🐾 MuseClaw</span>
      <span class="badge">常驻运行</span>
    </div>
    <div class="roster-title">虚拟员工通讯录 (Roster)</div>
    <div class="roster-list">
      <div class="bot-item active" onclick="switchBot('ops_bot', '💻 自动化运维助手')">
        <div class="bot-avatar">💻</div>
        <div class="bot-info">
          <div class="bot-name">自动化运维助手</div>
          <div class="bot-desc">执行 Shell、系统巡检与资源清理</div>
        </div>
      </div>
      <div class="bot-item" onclick="switchBot('data_bot', '📊 报表与数据分析助手')">
        <div class="bot-avatar">📊</div>
        <div class="bot-info">
          <div class="bot-name">数据分析助手</div>
          <div class="bot-desc">处理内网数据表与业务统计导出</div>
        </div>
      </div>
      <div class="bot-item" onclick="switchBot('crawler_bot', '🌐 网页采集助手')">
        <div class="bot-avatar">🌐</div>
        <div class="bot-info">
          <div class="bot-name">网页采集助手</div>
          <div class="bot-desc">持久化 Chromium 页面抓取与监控</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Active Chat & Execution Panel -->
  <div class="main">
    <div class="header">
      <div class="active-bot-title">
        <span class="status-indicator"></span>
        <span id="currentBotLabel">💻 自动化运维助手</span>
      </div>
      <div style="font-size: 12px; color: var(--muted);">
        模型: DeepSeek · 门禁: Sentinel 物理风控在线
      </div>
    </div>

    <div class="messages" id="messagesList">
      <div class="message assistant">你好！我是你的专属常驻运维助手。已为你在沙箱中挂载了 Linux 工具链与 Sentinel 确定性安全门禁。<br/>你可以吩咐我执行系统检查、文件生成或清理任务。遇到不可逆高危操作，我会自动暂停并向你求证。</div>
    </div>

    <div class="footer">
      <div class="presets">
        <span style="font-size: 12px; color: var(--muted); line-height: 24px;">快捷试用：</span>
        <button class="preset-btn" onclick="usePreset('请帮我查看当前系统的基础信息（查看 uptime 和 uname -a）')">🟢 基础安全指令 (只读)</button>
        <button class="preset-btn" onclick="usePreset('请在 /tmp/test_muse.txt 写入内容，确认后使用 rm -rf /tmp/test_muse.txt 删除它')">🔴 高危操作 (触发 Sentinel 审批)</button>
      </div>
      <div class="input-bar">
        <input type="text" id="promptInput" class="input-box" placeholder="吩咐任务，例如：检查当前目录文件..." onkeydown="if(event.key==='Enter') sendTask()">
        <button id="sendBtn" class="send-btn" onclick="sendTask()">发送任务</button>
      </div>
    </div>
  </div>

  <script>
    let currentBotId = 'ops_bot';

    function switchBot(id, label) {
      currentBotId = id;
      document.getElementById('currentBotLabel').innerText = label;
      document.querySelectorAll('.bot-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    function usePreset(text) {
      document.getElementById('promptInput').value = text;
      sendTask();
    }

    function appendMessage(role, text) {
      const container = document.getElementById('messagesList');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    async function sendTask() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage('user', text);
      const assistantMsg = appendMessage('assistant', '');
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, botId: currentBotId })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const event = JSON.parse(line.slice(6));
              handleEvent(event, assistantMsg);
            }
          }
        }
      } catch (err) {
        assistantMsg.innerText += `\n[系统错误: ${err.message}]`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function handleEvent(event, assistantMsg) {
      const container = document.getElementById('messagesList');

      if (event.type === 'stream:text-delta') {
        assistantMsg.innerText += event.text;
        container.scrollTop = container.scrollHeight;
      }

      if (event.type === 'tool:call_start') {
        const toolBox = document.createElement('div');
        toolBox.className = 'tool-box';
        toolBox.id = `tool_${Date.now()}`;
        toolBox.innerHTML = `<strong>🔧 正在执行工具: ${event.toolName}</strong><pre>${JSON.stringify(event.input, null, 2)}</pre>`;
        container.appendChild(toolBox);
        container.scrollTop = container.scrollHeight;
      }

      if (event.type === 'sentinel:approval_needed') {
        const req = event.request;
        const card = document.createElement('div');
        card.className = 'sentinel-card';
        card.id = `approval_${req.approvalId}`;
        card.innerHTML = `
          <div class="sentinel-header">
            <span>🛡️ Sentinel 哨兵安全拦截</span>
            <span style="font-size: 11px; background: #b91c1c; padding: 2px 6px; border-radius: 4px;">高危动作 (${req.riskLevel})</span>
          </div>
          <div class="sentinel-desc">${req.actionSummary}</div>
          <div class="sentinel-actions">
            <button class="btn btn-reject" onclick="resolveApproval('${req.approvalId}', false)">❌ 拒绝执行</button>
            <button class="btn btn-approve" onclick="resolveApproval('${req.approvalId}', true)">✅ 批准执行</button>
          </div>
        `;
        container.appendChild(card);
        container.scrollTop = container.scrollHeight;
      }

      if (event.type === 'tool:call_end') {
        const doneTip = document.createElement('div');
        doneTip.style.fontSize = '12px';
        doneTip.style.color = '#10b981';
        doneTip.style.alignSelf = 'flex-start';
        doneTip.innerText = `  └─ ✅ 工具执行完成 (${event.durationMs}ms)`;
        container.appendChild(doneTip);
        container.scrollTop = container.scrollHeight;
      }
    }

    async function resolveApproval(approvalId, approved) {
      const card = document.getElementById(`approval_${approvalId}`);
      if (card) {
        card.style.animation = 'none';
        card.innerHTML = `<div style="color: ${approved ? '#86efac' : '#fca5a5'}; font-size: 13px;">` +
          `审批已提交：${approved ? '已批准，正在恢复沙箱执行...' : '已拒绝，已取消该操作'}</div>`;
      }
      await fetch(`/api/approvals/${approvalId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ approved })
      });
    }
  </script>
</body>
</html>
